<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Telemetric Activity Pulse">
  <title>Telemetric</title>
  <desc>Real-time API telemetry and fleet observability activity pulse</desc>
  <style>
    .bg { fill: #0b0f19; stroke: #26334d; stroke-width: 1.5; }
    .pulse { fill: none; stroke: #6366f1; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .pulse-glow { fill: none; stroke: #818cf8; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.25; }
    .dot { fill: #10b981; }
    .dot-glow { fill: #10b981; opacity: 0.35; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; stroke: #cbd5e1; }
      .pulse { stroke: #4f46e5; }
      .pulse-glow { stroke: #6366f1; opacity: 0.2; }
      .dot { fill: #059669; }
      .dot-glow { fill: #059669; opacity: 0.25; }
    }
  </style>
  <rect class="bg" x="1.5" y="1.5" width="29" height="29" rx="7" />
  <path class="pulse-glow" d="M5 16h4l3-7 4.5 14 4-11 2.5 4h4" />
  <path class="pulse" d="M5 16h4l3-7 4.5 14 4-11 2.5 4h4" />
  <circle class="dot-glow" cx="24.5" cy="7.5" r="3.5" />
  <circle class="dot" cx="24.5" cy="7.5" r="2" />
</svg>